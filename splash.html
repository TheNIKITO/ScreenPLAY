<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'">
<title>ScreenPLAY</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background:
      radial-gradient(260px 200px at 50% 30%, rgba(255, 255, 255, .08), transparent 70%),
      #0a0a0a;
    color: #f2f2f2;
    font: 14px "Segoe UI", system-ui, sans-serif;
    user-select: none; overflow: hidden;
    -webkit-app-region: drag;   /* dá pra arrastar a janelinha */
  }
  .logo { width: 92px; height: 92px; animation: bob 2s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-4px) scale(1.04); } }
  h1 { margin: 18px 0 0; font-size: 21px; font-weight: 400; letter-spacing: -.01em; color: #9a9a9a; }
  h1 b { font-weight: 800; color: #f2f2f2; }
  #status { margin-top: 28px; min-height: 18px; padding: 0 20px; color: #9a9a9a; font-size: 13px; text-align: center; }
  .bar { position: relative; width: 190px; height: 6px; margin-top: 12px; border-radius: 999px; background: #2a2a2a; overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: inherit; background: #f2f2f2; transition: width .25s ease-out; }
  .bar.indeterminate .fill { position: absolute; width: 38%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { left: -38%; } to { left: 100%; } }
  #ver { position: absolute; bottom: 12px; font-size: 11px; color: #5c5c5c; }
</style>
</head>
<body>
  <img class="logo" src="assets/icon.png" alt="">
  <h1>Screen<b>PLAY</b></h1>
  <div id="status">Iniciando…</div>
  <div id="bar" class="bar indeterminate"><div id="fill" class="fill"></div></div>
  <div id="ver"></div>
  <script src="splash.js"></script>
</body>
</html>
